about_research: >
  My research focuses on surgical robotics and precision robot manipulation,
  with particular interests in physical AI, visual intelligence, and shared autonomy.
about_goal: >
  Our goal is to develop robotic systems that can interact safely and precisely
  with humans and complex physical environments.
research_themes:
- AI-Assisted Surgical Robotics
- Autonomous Precision Manipulation
- Continuum and Flexible Robots
- Visual Intelligence and Shared Autonomy
- Learning-based Robot Control for Contact-rich Manipulation
