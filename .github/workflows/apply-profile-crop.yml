name: Apply profile crop

on:
  push:
    paths:
      - ".github/workflows/apply-profile-crop.yml"

permissions:
  contents: write

jobs:
  crop:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Pillow
        run: python -m pip install --quiet pillow

      - name: Crop and optimize profile image
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image, ImageOps

          path = Path("assets/img/profile.JPG")

          with Image.open(path) as im:
              im = ImageOps.exif_transpose(im).convert("RGB")

              # New reference photo is the left 1509 px of the 2048 px-wide original.
              crop_ratio = 1509 / 2048
              crop_w = round(im.width * crop_ratio)
              im = im.crop((0, 0, crop_w, im.height))

              # Web-friendly size, preserving the new crop's aspect ratio.
              target_w = 1600
              target_h = round(im.height * target_w / im.width)
              im = im.resize((target_w, target_h), Image.Resampling.LANCZOS)

              tmp = path.with_suffix(".tmp.jpg")
              im.save(tmp, "JPEG", quality=90, optimize=True, progressive=True)
              tmp.replace(path)

              print("Saved:", im.size, path.stat().st_size, "bytes")
          PY

      - name: Commit cropped profile image
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/img/profile.JPG
          git commit -m "Use cropped profile photo"
          git push
