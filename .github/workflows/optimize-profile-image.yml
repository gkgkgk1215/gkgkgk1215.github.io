name: Optimize profile image

on:
  push:
    paths:
      - ".github/workflows/optimize-profile-image.yml"

permissions:
  contents: write

jobs:
  optimize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Pillow
        run: python -m pip install --quiet pillow

      - name: Optimize JPEG
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image, ImageOps

          path = Path("assets/img/profile.JPG")
          before = path.stat().st_size

          with Image.open(path) as im:
              im = ImageOps.exif_transpose(im).convert("RGB")
              tmp = path.with_suffix(".tmp.jpg")
              im.save(tmp, "JPEG", quality=92, optimize=True, progressive=True)
              tmp.replace(path)

          after = path.stat().st_size
          print(f"profile.JPG: {before/1024:.1f} KB -> {after/1024:.1f} KB")
          PY

      - name: Commit optimized image
        run: |
          if git diff --quiet -- assets/img/profile.JPG; then
            echo "No image changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/img/profile.JPG
          git commit -m "Optimize profile image for web"
          git push
